<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sapcing & Sizing</title>
    <link rel="stylesheet" href="../dist/output.css" />
  </head>
  <body>
    <button class="w-28 h-25 p-6 bg-green-300 mx-6 mt-6">Tombol</button>

    <!-- width yang serig digunakan mulai 32 tambah 8 dan seterusnya -->
    <div class="w-32 h-25 bg-blue-500 p-6 m-6 rounded-lg">A</div>

    <div class="w-64 h-25 bg-blue-400 p-6 m-6 rounded-lg">B</div>

    <div class="w-80 h-25 bg-blue-300 p-6 m-6 rounded-lg">C</div>

    <!-- width full -->
    <div class="w-full h-25 bg-blue-200 p-6 m-6 rounded-lg">Full width</div>

    <!-- Praktik nyata -->
    <div class="p-6 bg-orange-500 w-64 h-auto m-6 rounded-lg">

    <div class="p-8 bg-orange-500 w-80 m-6 rounded-lg">

      <p class="mb-4">Calon Backend</p>

      <button class="px-8 py-4 bg-blue-300 rounded-lg">Lihat profil</button>
    </div>

    <div class="p-6 space-y-10 bg-green-500 w-88 h-auto rounded-lg">
      <div class="p-6 bg-orange-500 w-64 h-auto m-6 rounded-lg">
        <h1 class="text-2xl font-bold mb-2">Handika Saputra</h1>

        <p class="mb-4">Calon Full Stack Developer</p>

        <button class="px-6 py-3 bg-blue-300 rounded-lg">Lihat profil</button>
      </div>

      <div class="p-8 bg-orange-500 w-64 m-6 rounded-lg">
        <h1 class="text-2xl font-bold mb-2">Ririn Dwi Aryanti</h1>

        <p class="mb-4">Calon Backend</p>

        <button class="px-8 py-4 bg-blue-300 rounded-lg">Lihat profil</button>
      </div>
    </div>

</html>
